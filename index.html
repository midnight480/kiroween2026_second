<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>Tomoshibi 灯 — The Candle Ledger</title>
  <meta name="description" content="A to-do list where every deadline is a candle. Don't let it go out." />
</head>
<body>
  <div id="gate">
    <div class="gate-inner">
      <h1>灯 <span>Tomoshibi</span></h1>
      <p class="sub" data-i18n="subtitle">The Candle Ledger</p>
      <p class="warn" data-i18n-html="gateWarn"></p>
      <button id="enter" class="btn" data-i18n="gateEnter"></button>
      <label class="safe"><input type="checkbox" id="safe-gate" /> <span data-i18n="gateSafe"></span></label>
      <div class="gate-lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">English</button>
        <button type="button" data-lang="ja">日本語</button>
      </div>
    </div>
  </div>
  <header id="top">
    <div class="brand"><b>灯</b> Tomoshibi <small data-i18n="subtitle"></small></div>
    <div class="proj">
      <button type="button" id="proj-btn" class="proj-btn" aria-haspopup="menu" aria-expanded="false" aria-controls="proj-menu" data-i18n-title="projMenuAria">
        <span class="proj-name" id="proj-name"></span><span class="caret" aria-hidden="true">▾</span>
      </button>
      <div id="proj-menu" class="proj-menu" role="menu" hidden data-i18n-aria="projMenuAria"></div>
    </div>
    <nav class="nav" data-i18n-aria="navAria">
      <a href="./" aria-current="page" data-i18n="navBoard"></a>
      <a href="members.html" data-i18n="navTeam"></a>
      <a href="help.html" data-i18n="navHelp"></a>
    </nav>
    <div id="auth" class="auth" hidden></div>
    <button type="button" id="new" class="new-btn" data-i18n-title="newCandleTitle">
      <span class="pumpkin-btn" aria-hidden="true"></span><span data-i18n="newCandle"></span>
    </button>
  </header>
  <main id="board">
    <section class="col" data-status="todo" aria-labelledby="h-todo">
      <header><span class="mark" aria-hidden="true">未</span><h2 id="h-todo" data-i18n="colTodo"></h2><span class="n" id="n-todo">0</span></header>
      <div class="list"></div><p class="col-empty" data-i18n="colEmpty"></p>
    </section>
    <section class="col" data-status="doing" aria-labelledby="h-doing">
      <header><span class="mark" aria-hidden="true">灯</span><h2 id="h-doing" data-i18n="colDoing"></h2><span class="n" id="n-doing">0</span></header>
      <div class="list"></div><p class="col-empty" data-i18n="colEmpty"></p>
    </section>
    <section class="col" data-status="done" aria-labelledby="h-done">
      <header><span class="mark" aria-hidden="true">消</span><h2 id="h-done" data-i18n="colDone"></h2><span class="n" id="n-done">0</span></header>
      <div class="list"></div><p class="col-empty" data-i18n="colEmpty"></p>
    </section>
  </main>
  <div id="empty">
    <svg class="child" viewBox="0 0 60 90" aria-hidden="true"><circle cx="30" cy="20" r="14" fill="#c9bfa6"/><path d="M12 24 Q30 -4 48 24 L48 30 Q30 6 12 30Z" fill="#050505"/><path d="M14 90 L18 44 Q30 38 42 44 L46 90Z" fill="#a3331f"/><circle cx="25" cy="21" r="1.6" fill="#050505"/><circle cx="35" cy="21" r="1.6" fill="#050505"/></svg>
    <p><span data-i18n="emptyMain"></span><br /><small><span data-i18n="emptySub1"></span><br /><span data-i18n="emptySub2"></span></small></p>
  </div>
  <div id="dark"></div>
  <div id="presence"></div>
  <div id="undo" hidden><span id="undo-text"></span> <button type="button" id="undo-btn" data-i18n="undoBtn"></button></div>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>
  <footer id="bottom">
    <span class="rules" data-i18n="rules" data-i18n-title="rulesTitle"></span>
    <span class="count"><i class="pumpkin-mini"></i> <span data-i18n="haunted"></span> <b id="haunted">0</b></span>
    <span class="count out" data-i18n-title="putOutTitle"><span data-i18n="putOut"></span> <b id="putout">0</b></span>
    <label data-i18n-title="safeTitle"><input type="checkbox" id="safe" /> <span data-i18n="safe"></span></label>
    <label><input type="checkbox" id="mute" /> <span data-i18n="mute"></span></label>
    <label class="pick"><span data-i18n="theme"></span>
      <select id="theme">
        <option value="system" data-i18n="themeSystem"></option>
        <option value="light" data-i18n="themeLight"></option>
        <option value="dark" data-i18n="themeDark"></option>
      </select>
    </label>
    <label class="pick"><span data-i18n="lang"></span>
      <select id="lang"><option value="en">English</option><option value="ja">日本語</option></select>
    </label>
  </footer>
  <dialog id="task-dialog" aria-labelledby="dlg-title">
    <form id="task-form" method="dialog" novalidate autocomplete="off">
      <header>
        <h2 id="dlg-title"></h2>
        <button type="button" class="x" id="dlg-close" data-i18n-aria="dlgClose">×</button>
      </header>
      <div class="f" id="f-project-wrap"><label for="f-project" data-i18n="fProject"></label>
        <select id="f-project"></select>
      </div>
      <label class="f"><span data-i18n="fTitle"></span>
        <input id="f-title" type="text" maxlength="80" data-i18n-ph="fTitlePh" required />
      </label>
      <div class="f">
        <label for="f-due" data-i18n="fDue"></label>
        <input id="f-due" type="datetime-local" />
        <div class="chips" role="group" data-i18n-aria="fDueQuick">
          <button type="button" data-min="1" data-i18n="chip1"></button>
          <button type="button" data-min="30" data-i18n="chip30"></button>
          <button type="button" data-min="120" data-i18n="chip120"></button>
          <button type="button" data-min="1440" data-i18n="chip1440"></button>
          <button type="button" data-min="4320" data-i18n="chip4320"></button>
        </div>
        <small id="f-due-hint" aria-live="polite"></small>
      </div>
      <div class="row2">
        <div class="f"><label for="f-assignee" data-i18n="fAssignee"></label>
          <select id="f-assignee"></select>
          <div id="f-newmember" class="newmember" hidden>
            <input id="f-member-name" type="text" maxlength="30" data-i18n-ph="fMemberPh" data-i18n-aria="fMemberPh" />
            <button type="button" id="f-member-add" data-i18n="fMemberAdd"></button>
          </div>
        </div>
        <div class="f"><label for="f-status" data-i18n="fStatus"></label>
          <select id="f-status">
            <option value="todo" data-i18n="colTodo"></option>
            <option value="doing" data-i18n="colDoing"></option>
            <option value="done" data-i18n="colDone"></option>
          </select>
        </div>
      </div>
      <div id="f-custom" class="custom"></div>
      <div class="f">
        <label for="f-link" data-i18n="fLinks"></label>
        <ul id="f-links" class="linklist"></ul>
        <div class="linkadd">
          <input id="f-link" type="url" inputmode="url" data-i18n-ph="fLinkPh" />
          <button type="button" id="f-link-add" data-i18n="fLinkAdd"></button>
        </div>
      </div>
      <label class="f"><span data-i18n="fNote"></span>
        <textarea id="f-note" rows="3" maxlength="500" data-i18n-ph="fNotePh"></textarea>
        <small id="f-note-count" aria-hidden="true"></small>
      </label>
      <p id="f-err" class="form-err" role="alert" hidden></p>
      <footer>
        <div class="salt-wrap"><div class="salt"></div></div>
        <button type="button" id="dlg-cancel" class="ghost" data-i18n="cancel"></button>
        <button type="submit" id="dlg-ok" class="btn"></button>
      </footer>
    </form>
  </dialog>
  <dialog id="proj-dialog" aria-labelledby="pd-title">
    <form id="proj-form" method="dialog" novalidate autocomplete="off">
      <header>
        <h2 id="pd-title"></h2>
        <button type="button" class="x" id="pd-close" data-i18n-aria="dlgClose">×</button>
      </header>
      <label class="f"><span data-i18n="projName"></span>
        <input id="pd-name" type="text" maxlength="40" data-i18n-ph="projNamePh" />
      </label>
      <div class="f">
        <span data-i18n="projFields"></span>
        <small data-i18n="projFieldsHint"></small>
        <div id="pd-fields" class="fielded"></div>
        <button type="button" id="pd-add-field" class="ghost addfield" data-i18n="fieldAdd"></button>
      </div>
      <p id="pd-err" class="form-err" role="alert" hidden></p>
      <footer>
        <div class="salt-wrap"><div class="salt"></div></div>
        <button type="button" id="pd-delete" class="ghost hold danger" data-i18n-title="projDeleteTitle"><span data-i18n="projDelete"></span></button>
        <button type="button" id="pd-cancel" class="ghost" data-i18n="cancel"></button>
        <button type="submit" id="pd-ok" class="btn"></button>
      </footer>
    </form>
  </dialog>
  <div id="curse" hidden></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
